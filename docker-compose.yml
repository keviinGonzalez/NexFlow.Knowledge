services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: nexflow-knowledge-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: nexflowknowledge
      POSTGRES_USER: nexflow
      POSTGRES_PASSWORD: NexFlow2026!

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: