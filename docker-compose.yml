services:
  api:
    build:
      context: .
      dockerfile: NexFlow.Knowledge.Api/Dockerfile
    container_name: nexflow-knowledge-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Database=Host=postgres;Port=5432;Database=nexflowknowledge;Username=nexflow;Password=NexFlow2026!
      - Ollama__BaseUrl=http://ollama:11434
    depends_on:
      - postgres
      - ollama

  postgres:
    image: pgvector/pgvector:pg17
    container_name: nexflow-knowledge-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: nexflowknowledge
      POSTGRES_USER: nexflow
      POSTGRES_PASSWORD: NexFlow2026!

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    container_name: nexflow-knowledge-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  ollama_data: